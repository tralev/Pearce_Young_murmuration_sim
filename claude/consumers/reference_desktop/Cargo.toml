[package]
name = "reference_desktop"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false
description = "The minimal desktop reference consumer (roadmap.md Phase 12) — bare rendering, no gestures/HUD/governor, calling murmur_ffi's actual C surface, playing back checkpoints, with a minimal way to inject one command. Not a production app; proves the batch/checkpoint/command contract end to end."

[[bin]]
name = "reference_desktop"
path = "src/main.rs"

[dependencies]
murmur_ffi = { path = "../../crates/murmur_ffi" }
