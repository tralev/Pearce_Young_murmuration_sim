[package]
name = "murmur_py"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "pyo3 + numpy bindings for the science path (design/03_observables_bindings.md §2.1)."

[lib]
name = "_core"
# "rlib" alongside "cdylib" so `cargo build`/`cargo test` work standalone (no Python
# interpreter linked in); maturin uses the cdylib target for the actual extension module. This
# crate deliberately has zero #[test] functions — pyo3's `extension-module` feature doesn't
# link libpython, so a Rust-level test can't start an embedded interpreter to call into it.
# Correctness here is exercised via pytest instead (python/tests/), per roadmap.md's own test
# inventory ("bindings (py) | pytest").
crate-type = ["cdylib", "rlib"]

[dependencies]
murmur_core = { path = "../murmur_core" }
murmur_external_field = { path = "../plugins/murmur_external_field" }
murmur_fixed_speed = { path = "../plugins/murmur_fixed_speed" }
murmur_hash_grid = { path = "../plugins/murmur_hash_grid" }
murmur_initializers = { path = "../plugins/murmur_initializers" }
murmur_instant_response = { path = "../plugins/murmur_instant_response" }
murmur_adaptive_index = { path = "../plugins/murmur_adaptive_index" }
murmur_angle = { path = "../plugins/murmur_angle" }
murmur_ceiling_speed = { path = "../plugins/murmur_ceiling_speed" }
murmur_hybrid_selection = { path = "../plugins/murmur_hybrid_selection" }
murmur_kdtree_index = { path = "../plugins/murmur_kdtree_index" }
murmur_knn_selection = { path = "../plugins/murmur_knn_selection" }
murmur_margin_domain = { path = "../plugins/murmur_margin_domain" }
murmur_none_speed = { path = "../plugins/murmur_none_speed" }
murmur_open_domain = { path = "../plugins/murmur_open_domain" }
murmur_sphere_domain = { path = "../plugins/murmur_sphere_domain" }
murmur_sphere_soft_domain = { path = "../plugins/murmur_sphere_soft_domain" }
murmur_spatial = { path = "../plugins/murmur_spatial" }
murmur_pearce = { path = "../plugins/murmur_pearce" }
murmur_predator = { path = "../plugins/murmur_predator" }
murmur_predator_fsm = { path = "../plugins/murmur_predator_fsm" }
murmur_radius_gather = { path = "../plugins/murmur_radius_gather" }
murmur_spin_wave = { path = "../plugins/murmur_spin_wave" }
murmur_torus_domain = { path = "../plugins/murmur_torus_domain" }
murmur_vicsek = { path = "../plugins/murmur_vicsek" }
murmur_young = { path = "../plugins/murmur_young" }
numpy = "0.22"
pyo3 = { version = "0.22", features = ["extension-module"] }
