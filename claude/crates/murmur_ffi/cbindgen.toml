language = "C"
header = """
/* murmur_ffi — the simulation-control-only extern "C" surface (design/05_viz_contract.md §4,
 * roadmap.md Phase 11). Generated by cbindgen from crates/murmur_ffi/src/lib.rs — see that
 * file for full safety-contract documentation on every function (each has a `# Safety`
 * doc comment there that this generated header does not reproduce). Do not edit by hand;
 * regenerate with:
 *   .tooling/cargo-install/bin/cbindgen --config cbindgen.toml --output include/murmur_ffi.h
 * (run from crates/murmur_ffi/), after `cargo build -p murmur_ffi`.
 */
"""
include_guard = "MURMUR_FFI_H"
autogen_warning = "/* This file is auto-generated by cbindgen. Do not modify by hand. */"
sys_includes = ["stdint.h", "stddef.h"]
no_includes = true
documentation = true
documentation_style = "doxy"

[export]
prefix = ""

[fn]
prefix = ""
