[package]
name = "murmur_obstacles"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Full SDF+CSG obstacle-avoidance StepHook: sphere/box/cylinder primitives, union/subtract, numerical gradient, collision detection (roadmap.md Phase 18, design/02_plugins.md pymurmur physics/obstacles.py). The last plugin in Phase 18's own catalogue."

[dependencies]
