[package]
name = "murmur_influencer"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Influencer: rank/distance-weighted attractor FlockingMode pursuing a moving Lissajous target (roadmap.md Phase 17, design/02_plugins.md pymurmur physics/forces/influencer.py). The first FlockingMode plugin to use G4's step_count/dt for a genuinely time-varying target."

[dependencies]
murmur_core = { path = "../../murmur_core" }

[dev-dependencies]
murmur_conformance = { path = "../../murmur_conformance" }
murmur_pearce = { path = "../murmur_pearce" }
murmur_vicsek = { path = "../murmur_vicsek" }
murmur_instant_response = { path = "../murmur_instant_response" }
murmur_open_domain = { path = "../murmur_open_domain" }
murmur_hash_grid = { path = "../murmur_hash_grid" }
murmur_radius_gather = { path = "../murmur_radius_gather" }
murmur_initializers = { path = "../murmur_initializers" }
rayon = "1"
