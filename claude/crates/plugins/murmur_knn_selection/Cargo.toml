[package]
name = "murmur_knn_selection"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "KnnSelection: a topological (fixed neighbour count) NeighborSelection plugin (roadmap.md Phase 13, Track C Tier C1). Second NeighborSelection occupant, proving the seam is real beyond RadiusGather — queries index.candidates_knn() rather than a fixed radius, matching the k-NN branch of sci/comparison.md's taxonomy (e.g. Young's own m-nearest-neighbour consensus graph)."

[dependencies]
murmur_core = { path = "../../murmur_core" }

[dev-dependencies]
murmur_conformance = { path = "../../murmur_conformance" }
murmur_hash_grid = { path = "../murmur_hash_grid" }
murmur_kdtree_index = { path = "../murmur_kdtree_index" }
murmur_radius_gather = { path = "../murmur_radius_gather" }
