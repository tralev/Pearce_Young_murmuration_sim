[package]
name = "murmur_wander"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Bounded attractor-motion StepHook for the flock centre (roadmap.md Phase 18, design/02_plugins.md pymurmur physics/extensions/wander.py). Publishes wander_center/wander_heading. Reuses murmur_field's own Lissajous+envelope curve formula, applied around the flock's live centroid rather than a fixed anchor."

[dependencies]
murmur_core = { path = "../../murmur_core" }

[dev-dependencies]
murmur_conformance = { path = "../../murmur_conformance" }
murmur_pearce = { path = "../murmur_pearce" }
murmur_instant_response = { path = "../murmur_instant_response" }
murmur_open_domain = { path = "../murmur_open_domain" }
murmur_hash_grid = { path = "../murmur_hash_grid" }
murmur_radius_gather = { path = "../murmur_radius_gather" }
murmur_initializers = { path = "../murmur_initializers" }
rayon = "1"
