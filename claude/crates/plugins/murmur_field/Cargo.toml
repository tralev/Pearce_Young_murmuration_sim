[package]
name = "murmur_field"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Field: 11-term Lissajous blob-anchor FlockingMode (roadmap.md Phase 17, design/02_plugins.md pymurmur physics/forces/field.py + field_anchors.py + field_terms.py). Generalizes murmur_influencer's single moving target to multiple spatially-distributed anchors, each boid drawn to its nearest one -- a genuine spatial field, not one shared target."

[dependencies]
murmur_core = { path = "../../murmur_core" }

[dev-dependencies]
murmur_conformance = { path = "../../murmur_conformance" }
murmur_pearce = { path = "../murmur_pearce" }
murmur_vicsek = { path = "../murmur_vicsek" }
murmur_instant_response = { path = "../murmur_instant_response" }
murmur_open_domain = { path = "../murmur_open_domain" }
murmur_hash_grid = { path = "../murmur_hash_grid" }
murmur_radius_gather = { path = "../murmur_radius_gather" }
murmur_initializers = { path = "../murmur_initializers" }
rayon = "1"
