[package]
name = "murmur_boid_state_machine"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "BoidStateMachine: per-boid Normal/Isolated/Crowded/Threatened state + speed-cap multiplier StepHook (roadmap.md Phase 18, design/02_plugins.md pymurmur physics/extensions/boid_state_machine.py). The plugin that motivated fixing G1 (real neighbour data in post_steer) and G3 (a StepHook -> SpeedModel speed-cap channel)."

[dependencies]
murmur_core = { path = "../../murmur_core" }

[dev-dependencies]
murmur_conformance = { path = "../../murmur_conformance" }
murmur_pearce = { path = "../murmur_pearce" }
murmur_instant_response = { path = "../murmur_instant_response" }
murmur_open_domain = { path = "../murmur_open_domain" }
murmur_hash_grid = { path = "../murmur_hash_grid" }
murmur_radius_gather = { path = "../murmur_radius_gather" }
murmur_initializers = { path = "../murmur_initializers" }
rayon = "1"
