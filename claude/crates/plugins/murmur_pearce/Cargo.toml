[package]
name = "murmur_pearce"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "PearceProjection: the first FlockingMode plugin, and the slice's scientific subject (design/01_core.md §8). Pearce (2014) visual-projection flocking via occlude()."

[dependencies]
murmur_core = { path = "../../murmur_core" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
murmur_conformance = { path = "../../murmur_conformance" }
murmur_hash_grid = { path = "../murmur_hash_grid" }
murmur_initializers = { path = "../murmur_initializers" }
murmur_instant_response = { path = "../murmur_instant_response" }
murmur_open_domain = { path = "../murmur_open_domain" }
murmur_radius_gather = { path = "../murmur_radius_gather" }
rayon = "1"
